<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cozy Cinema - Watch Movies Together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="landing-body">
  <div class="stars-bg"></div>

  <main class="landing-container">
    <div class="brand-header">
      <div class="popcorn-badge">🍿 Tonight's Movie Night</div>
      <h1>Cozy <span>Cinema</span></h1>
      <p class="tagline">Watch any movie, stream, or video together in real-time sync with top 1080p quality and zero lag ❤️</p>
    </div>

    <!-- Active Rooms Alert -->
    <div id="activeRoomsSection" class="active-rooms-card hidden">
      <div class="pulse-header">
        <span class="live-dot"></span>
        <span>A room is open and waiting for you right now! 🎉</span>
      </div>
      <div id="activeRoomsList" class="active-rooms-list"></div>
    </div>

    <div class="glass-card">
      <div class="form-group">
        <label for="userName">Your Name</label>
        <input type="text" id="userName" placeholder="e.g. Alex" maxlength="20" autofocus>
      </div>

      <div class="form-group">
        <label for="roomInput">Room Name or Code</label>
        <div class="input-with-button">
          <input type="text" id="roomInput" placeholder="Enter room name or generate random">
          <button type="button" id="btnRandomRoom" class="btn-secondary" title="Generate random name">🎲</button>
        </div>
      </div>

      <button id="btnEnterRoom" class="btn-primary">
        <span>Enter Room & Watch 🎬</span>
      </button>

      <div class="features-pill-row">
        <span>⚡ Zero Lag</span>
        <span>📱 Mobile Optimized</span>
        <span>❤️ Live Reactions</span>
        <span>🎬 1080p Master Quality</span>
      </div>
    </div>
  </main>

  <script>
    const adjectives = ['cozy', 'sweet', 'cute', 'magic', 'happy', 'chill', 'night', 'starry', 'velvet'];
    const nouns = ['cinema', 'movie', 'date', 'room', 'party', 'vibes', 'couch', 'popcorn', 'haven'];

    function generateRandomRoom() {
      const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
      const noun = nouns[Math.floor(Math.random() * nouns.length)];
      const num = Math.floor(100 + Math.random() * 900);
      return `${adj}-${noun}-${num}`;
    }

    const nameInput = document.getElementById('userName');
    const roomInput = document.getElementById('roomInput');
    const btnRandom = document.getElementById('btnRandomRoom');
    const btnEnter = document.getElementById('btnEnterRoom');

    const activeRoomsSection = document.getElementById('activeRoomsSection');
    const activeRoomsList = document.getElementById('activeRoomsList');

    const savedName = localStorage.getItem('cozy_username');
    if (savedName) nameInput.value = savedName;

    roomInput.value = generateRandomRoom();

    btnRandom.addEventListener('click', () => {
      roomInput.value = generateRandomRoom();
    });

    const urlParams = new URLSearchParams(window.location.search);
    const queryRoom = urlParams.get('room');
    if (queryRoom) {
      roomInput.value = queryRoom;
    }

    async function checkActiveRooms() {
      try {
        const res = await fetch('/api/rooms');
        const data = await res.json();
        if (data.activeRooms && data.activeRooms.length > 0) {
          activeRoomsList.innerHTML = '';
          data.activeRooms.forEach(room => {
            const item = document.createElement('div');
            item.className = 'active-room-item';
            item.innerHTML = `
              <div class="room-info-meta">
                <b>🎬 Room: ${room.id}</b>
                <small>Watching: ${room.users.join(', ')}</small>
              </div>
              <button class="btn-enter-room" data-room="${room.id}">Join Now 👉</button>
            `;
            activeRoomsList.appendChild(item);
          });
          activeRoomsSection.classList.remove('hidden');

          if (!queryRoom) {
            roomInput.value = data.activeRooms[0].id;
          }

          document.querySelectorAll('.btn-enter-room').forEach(btn => {
            btn.addEventListener('click', () => {
              const r = btn.getAttribute('data-room');
              enterRoom(r);
            });
          });
        }
      } catch (err) {}
    }
    checkActiveRooms();

    function enterRoom(roomName) {
      const name = nameInput.value.trim() || 'Viewer';
      const cleanRoom = (roomName || generateRandomRoom()).replace(/\s+/g, '-').toLowerCase();
      localStorage.setItem('cozy_username', name);
      window.location.href = `/room/${encodeURIComponent(cleanRoom)}`;
    }

    btnEnter.addEventListener('click', () => {
      const room = roomInput.value.trim() || generateRandomRoom();
      enterRoom(room);
    });

    nameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') btnEnter.click();
    });
    roomInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') btnEnter.click();
    });
  </script>
</body>
</html>
