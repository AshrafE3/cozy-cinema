<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cozy Cinema - Watch Movies Together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .home-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 22px;
      gap: 6px;
    }
    .home-tab-btn {
      flex: 1;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .home-tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }
    .home-tab-btn.active {
      background: linear-gradient(135deg, #ff4b72, #e0284f);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 75, 114, 0.4);
    }
    .home-pane {
      display: none;
    }
    .home-pane.active {
      display: block;
      animation: fadeInPane 0.25s ease;
    }
    @keyframes fadeInPane {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="landing-body">
  <div class="stars-bg"></div>

  <main class="landing-container">
    <div class="brand-header">
      <div class="popcorn-badge">🍿 Tonight's Movie Night</div>
      <h1>Cozy <span>Cinema</span></h1>
      <p class="tagline">Watch any movie, stream, or video together in real-time sync with top 1080p quality and zero lag ❤️</p>
    </div>

    <!-- Active Rooms Alert -->
    <div id="activeRoomsSection" class="active-rooms-card hidden">
      <div class="pulse-header">
        <span class="live-dot"></span>
        <span>A room is open and waiting for you right now! 🎉</span>
      </div>
      <div id="activeRoomsList" class="active-rooms-list"></div>
    </div>

    <div class="glass-card">
      <!-- High-End Segmented Tab Switcher -->
      <div class="home-tabs">
        <button type="button" class="home-tab-btn active" id="tabCreateBtn">
          <span>➕</span> Create New Room
        </button>
        <button type="button" class="home-tab-btn" id="tabJoinBtn">
          <span>👥</span> Join Room
        </button>
      </div>

      <div class="form-group">
        <label for="userName">Your Name</label>
        <input type="text" id="userName" placeholder="e.g. Alex" maxlength="20" autofocus>
      </div>

      <!-- Create Room Tab Pane -->
      <div id="paneCreate" class="home-pane active">
        <div class="form-group">
          <label for="createRoomInput">New Room Name</label>
          <div class="input-with-button">
            <input type="text" id="createRoomInput" placeholder="e.g. movie-night">
            <button type="button" id="btnRandomRoom" class="btn-secondary" title="Generate random name">🎲</button>
          </div>
        </div>
        <button id="btnCreateRoom" class="btn-primary">
          <span>Create Room & Start 🎬</span>
        </button>
      </div>

      <!-- Join Room Tab Pane -->
      <div id="paneJoin" class="home-pane">
        <div class="form-group">
          <label for="joinRoomInput">Room Name or Code</label>
          <input type="text" id="joinRoomInput" placeholder="Enter room name or code to join">
        </div>
        <button id="btnJoinRoom" class="btn-primary">
          <span>Join Room Now 👉</span>
        </button>
      </div>

      <div class="features-pill-row">
        <span>⚡ Zero Lag</span>
        <span>📱 Mobile Optimized</span>
        <span>❤️ Live Reactions</span>
        <span>🎬 1080p Master Quality</span>
      </div>
    </div>
  </main>

  <script>
    const adjectives = ['cozy', 'sweet', 'cute', 'magic', 'happy', 'chill', 'night', 'starry', 'velvet'];
    const nouns = ['cinema', 'movie', 'date', 'room', 'party', 'vibes', 'couch', 'popcorn', 'haven'];

    function generateRandomRoom() {
      const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
      const noun = nouns[Math.floor(Math.random() * nouns.length)];
      const num = Math.floor(100 + Math.random() * 900);
      return `${adj}-${noun}-${num}`;
    }

    const nameInput = document.getElementById('userName');
    const createRoomInput = document.getElementById('createRoomInput');
    const joinRoomInput = document.getElementById('joinRoomInput');
    const btnRandom = document.getElementById('btnRandomRoom');
    const btnCreate = document.getElementById('btnCreateRoom');
    const btnJoin = document.getElementById('btnJoinRoom');

    const tabCreateBtn = document.getElementById('tabCreateBtn');
    const tabJoinBtn = document.getElementById('tabJoinBtn');
    const paneCreate = document.getElementById('paneCreate');
    const paneJoin = document.getElementById('paneJoin');

    const activeRoomsSection = document.getElementById('activeRoomsSection');
    const activeRoomsList = document.getElementById('activeRoomsList');

    const savedName = localStorage.getItem('cozy_username');
    if (savedName) nameInput.value = savedName;

    createRoomInput.value = generateRandomRoom();

    btnRandom.addEventListener('click', () => {
      createRoomInput.value = generateRandomRoom();
    });

    tabCreateBtn.addEventListener('click', () => {
      tabCreateBtn.classList.add('active');
      tabJoinBtn.classList.remove('active');
      paneCreate.classList.add('active');
      paneJoin.classList.remove('active');
    });

    tabJoinBtn.addEventListener('click', () => {
      tabJoinBtn.classList.add('active');
      tabCreateBtn.classList.remove('active');
      paneJoin.classList.add('active');
      paneCreate.classList.remove('active');
      joinRoomInput.focus();
    });

    const urlParams = new URLSearchParams(window.location.search);
    const queryRoom = urlParams.get('room');
    if (queryRoom) {
      joinRoomInput.value = queryRoom;
      tabJoinBtn.click();
    }

    async function checkActiveRooms() {
      try {
        const res = await fetch('/api/rooms');
        const data = await res.json();
        if (data.activeRooms && data.activeRooms.length > 0) {
          activeRoomsList.innerHTML = '';
          data.activeRooms.forEach(room => {
            const item = document.createElement('div');
            item.className = 'active-room-item';
            item.innerHTML = `
              <div class="room-info-meta">
                <b>🎬 Room: ${room.id}</b>
                <small>Watching: ${room.users.join(', ')}</small>
              </div>
              <button class="btn-enter-room" data-room="${room.id}">Join Now 👉</button>
            `;
            activeRoomsList.appendChild(item);
          });
          activeRoomsSection.classList.remove('hidden');

          if (!queryRoom && !joinRoomInput.value) {
            joinRoomInput.value = data.activeRooms[0].id;
          }

          document.querySelectorAll('.btn-enter-room').forEach(btn => {
            btn.addEventListener('click', () => {
              const r = btn.getAttribute('data-room');
              enterRoom(r);
            });
          });
        }
      } catch (err) {}
    }
    checkActiveRooms();

    function enterRoom(roomName) {
      const name = nameInput.value.trim() || 'Viewer';
      const cleanRoom = (roomName || generateRandomRoom()).replace(/\s+/g, '-').toLowerCase();
      localStorage.setItem('cozy_username', name);
      window.location.href = `/room/${encodeURIComponent(cleanRoom)}`;
    }

    btnCreate.addEventListener('click', () => {
      const room = createRoomInput.value.trim() || generateRandomRoom();
      enterRoom(room);
    });

    btnJoin.addEventListener('click', () => {
      const room = joinRoomInput.value.trim();
      if (!room) {
        alert('Please enter a room name or code to join');
        joinRoomInput.focus();
        return;
      }
      enterRoom(room);
    });

    nameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        if (paneCreate.classList.contains('active')) btnCreate.click();
        else btnJoin.click();
      }
    });
    createRoomInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') btnCreate.click();
    });
    joinRoomInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') btnJoin.click();
    });
  </script>
</body>
</html>
